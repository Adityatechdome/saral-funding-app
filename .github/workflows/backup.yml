name: Daily MongoDB Backup

on:
  schedule:
    - cron: "30 20 * * *"   # 2:00 AM IST (UTC+5:30) every day
  workflow_dispatch:          # allow manual run from GitHub Actions tab

jobs:
  backup:
    name: Backup MongoDB to Azure Blob
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pymongo azure-storage-blob python-dotenv

      - name: Run backup
        env:
          MONGO_URL:          ${{ secrets.MONGO_URL }}
          DB_NAME:            ${{ secrets.DB_NAME }}
          AZURE_ACCOUNT_NAME: ${{ secrets.AZURE_ACCOUNT_NAME }}
          AZURE_CONTAINER:    ${{ secrets.AZURE_CONTAINER }}
          AZURE_SAS_TOKEN:    ${{ secrets.AZURE_SAS_TOKEN }}
          BACKUP_RETENTION_DAYS: "30"
        run: |
          cd backend
          python backup.py

      - name: Notify on failure
        if: failure()
        run: |
          echo "Backup failed on $(date)" >> $GITHUB_STEP_SUMMARY
